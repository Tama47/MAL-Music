<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>MAL Anime Music</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="Asset/favicon.ico">
</head>

<body>

    <h2>
        <img src="Asset/MyAnimeList_Logo.png" style="height: 1em; width: auto; vertical-align: middle;">
        MyAnimeList → Anime Music
        <img src="Asset/Youtube_Music_icon.png" style="height: 1em; width: auto; vertical-align: middle;">
    </h2>

    <div class="toolbar">

        <div>
            <input type="text" id="username" placeholder="Enter MAL username">

            <select id="status">
                <option value="7">All</option>
                <option value="1" selected>Watching</option>
                <option value="2">Completed</option>
                <option value="3">On-Hold</option>
                <option value="4">Dropped</option>
                <option value="6">Planned</option>
            </select>

            <button onclick="goUser()">Load</button>
        </div>

        <div class="lang-toggle">
            <button id="lang-en" class="lang-btn active">🇬🇧 EN</button>
            <button id="lang-jp" class="lang-btn">🇯🇵 JP</button>
        </div>

    </div>

    <div id="results"></div>

    <script src="main.js"></script>

</body>

</html>
